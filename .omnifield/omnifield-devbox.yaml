# Настройки обвеса девбокса (@omnifield/baser-devbox). Читается ключ `baser`.
#
# Заполнено ТОЛЬКО то, что диктует стек weber. Всё остальное — дефолты обвеса и
# пресет: незаполненное едет за его выпусками, заполненное — не поднимается.
baser:
  presets:
    # Раскладка omnifield: сеть omnifield-gateway + peer-alias, тома omnifield-secrets
    # и omnifield-pnpm-store, ассистент внутрь контейнера.
    - omnifield
  settings:
    # weber потребляет @omnifield/* — без проверки npm уходит в npmjs.org и отвечает
    # «404, пакета нет» вместо «нет доступа». В пресет настройка не уехала сознательно:
    # baser свои пакеты производит, а не потребляет.
    #
    # Настроек ДВЕ с обвеса 0.6.0 (было одно `privateScope`) — по нашей же заявке
    # tasker:BASER2-103 п.4: состояние выражается ЗНАЧЕНИЕМ, а не отсутствием ключа.
    npmScope: "@omnifield"
    # true = сегодняшняя реальность: @omnifield/* лежат в GitHub Packages, доступ
    # проверяем. В день, когда исполнится kb:ADR-19 (реестр экосистемы — публичный
    # npm), здесь станет false, и проверка исчезнет из артефакта. Долг — tasker:WEBER-36.
    npmScopeIsPrivate: true
    # Стек репозитория — Biome (biome.json + @omnifield/biome-preset), не prettier.
    # Форматтер обвес сам добавит в список расширений, перечислять дважды не нужно.
    editorFormatter: biomejs.biome
    # Дефолт обвеса несёт prettier-расширение — оно здесь лишнее. Nx-консоль оставляем:
    # репозиторий на nx.
    editorExtensions:
      - nrwl.angular-console
