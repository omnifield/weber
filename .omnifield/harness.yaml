# harness.yaml — роль-модель weber (agent-harness plugin).
#
# Файлом владеет продукт. Рамка (инварианты ролей) впаяна в .claude/agents/*.md,
# здесь — ДАННЫЕ роль-модели под weber.
#
# Канон продукта — раздел WEBER в knowledger. Роадмап — раздел WEBER в tasker.
apiVersion: omnifield.dev/v1
kind: harness

product: weber

# Один архитектор: продукт один, зон пока нет.
architects: 1

# Пины по факту сессий. architect — сильнейшая, остальные по дефолту рамки.
models:
  architect: claude-opus-5
  owner: claude-opus-4-8
  layer: claude-haiku-4-5-20251001

# ЗОНЫ ПОКА НЕ РЕЖЕМ — СОЗНАТЕЛЬНО.
#
# Раскладка weber (core/ packages/ tools/ apps/) отражает текущие папки, но не
# согласованную роль-модель: weber по уровню = фундамент, и резать его надо под
# фреймворк, а не под то, что случайно сложилось. Модель обсуждается отдельно —
# задача 0.5, tasker:WEBER-6; гейтится границей «фреймворк ↔ продукт» (tasker:WEBER-5).
#
# Следствие сейчас: работает только architect/main. owner-сессии стартовать
# нельзя, и это правильно — governance резал бы по непродуманным границам.
# Доктор об этом честно предупреждает.
zones: {}

# Git-доступ по роли — РАМКА (инвариант shared-policy), выключить нельзя:
# architect=full · owner=commit-only (gate) · layer=none.
git:
  architect: full
  owner: commit-only
  layer: none

# Затыки и грабли — центральный догфуд-беклог под контролем brainer-архитектора.
grabli:
  workspace: GRABLI2

# Базы сервисов. После переезда девбокса на обвес baser контейнер входит в сеть
# omnifield-gateway под алиасом weber — соседи отвечают напрямую (проверено
# 2026-07-30, tasker:WEBER-34). Прежняя запись «соседи недоступны, только дверь»
# относилась к старому девбоксу и снята.
# Запасной путь, если соседи молчат, — дверь через хост:
#   http://host.docker.internal:8080/api/tasker · .../api/knowledger
# localhost:8080 изнутри контейнера НЕ отвечает — это адрес хост-машины.
# Доступ — curl'ом через Bash с ОТКЛЮЧЁННЫМ сэндбоксом (сэндбокс режет сеть).
# Auth — стаб: `Authorization: Bearer <любой непустой handle>`, handle пишется actor'ом.
# Проверка связи: curl -s <base>/healthz
services:
  tasker: http://tasker:8030/tasker
  knowledger: http://knowledger:8040/knowledger

# Раздел пилотов — общая площадка продуктов, где меха обкатывается ДО каталога
# канонов (`kb:MECH`). Правила целиком — `kb:PILOT-1`. Адрес взят из сида обвеса
# 0.2.0; оба воркспейса проверены живыми 2026-08-01.
#
# Нас это касается напрямую: установка обвеса агент-харнесса в weber и есть
# ступень «обкатка» для роль-рамки (`tasker:PILOT-2`) — мы второй продукт.
pilots:
  tasker: PILOT
  knowledger: PILOT

# Корень чекпойнтов РОЛЕЙ. Слот приехал с обвесом 0.2.0, но практика у нас старше:
# `tasker:WEBER-28` ведётся точкой входа architect-сессии с самого начала и
# обновляется на месте — узел на роль, стабильный адрес, описание = текущее
# состояние, комменты = история. Ровно то, что слот и описывает.
#
# Смысл заполнения: адрес чекпойнта теперь называет харнесс в баннере сессии, а не
# сообщение о рестарте, написанное руками. Рестарт контейнера перестаёт стоить
# знания о том, где мы остановились.
checkpoints:
  workspace: WEBER
  root: WEBER-28
