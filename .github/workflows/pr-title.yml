# NOTE: in-repo копия. Уезжает в reusable workflow devopser'а
# (briefs/repo-skeleton-product.md D1).
name: PR title

# Гейтит заголовок PR по Conventional Commits: squash-merge берёт заголовок PR
# как commit subject — сигнал должен быть машиночитаемым (канон commit-каденса).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Semantic PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            chore
            build
            ci
